services:
  app:
    build: .
    container_name: suppression-manager
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - suppression_data:/data

  caddy:
    image: caddy:2
    container_name: suppression-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  suppression_data:
  caddy_data:
  caddy_config:
