server {
    listen 80;
    server_name unsubmepanel.remobtracks.com;

    location / {
        return 301 https://$host$request_uri;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl http2;
    server_name unsubmepanel.remobtracks.com;

    ssl_certificate /etc/letsencrypt/live/unsubmepanel.remobtracks.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unsubmepanel.remobtracks.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

